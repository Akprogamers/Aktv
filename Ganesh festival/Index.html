<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Festival Fund Manager 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.0/index.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
:root{--primary:#d97706;--primary-dark:#b45309;--secondary:#92400e;--bg:#fff7ed;--card:#ffffff;--text:#1c1917;--muted:#78716c;--border:#fed7aa;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--info:#0284c7}
body{background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f97316 0%,#ea580c 50%,#c2410c 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card img{width:180px;height:180px;object-fit:cover;border-radius:50%;margin:0 auto 20px;display:block;border:5px solid var(--primary)}
.login-card h1{font-size:28px;color:var(--primary-dark);text-align:center;margin-bottom:5px}
.login-card .subtitle{color:var(--muted);text-align:center;margin-bottom:20px;font-size:14px}
.login-card .morya{text-align:center;color:var(--primary);font-size:16px;margin-bottom:25px;font-weight:600}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;transition:.2s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary)}
.btn{padding:12px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#f3f4f6;color:var(--text)}
.btn-secondary:hover{background:#e5e7eb}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-block{width:100%;justify-content:center}
.btn-sm{padding:6px 12px;font-size:12px}
.login-creds{margin-top:15px;padding:12px;background:#fef3c7;border-radius:10px;font-size:12px;color:var(--secondary)}
/* App Layout */
.app{display:none;min-height:100vh}
.app.active{display:block}
.topbar{background:#fff;border-bottom:2px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}
.topbar-left h2{font-size:18px;color:var(--primary-dark)}
.topbar-left p{font-size:12px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.year-tabs{display:flex;gap:5px}
.year-tab{padding:6px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:600}
.year-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.user-badge{padding:6px 14px;background:#fef3c7;border-radius:20px;font-size:12px;font-weight:600;color:var(--secondary)}
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:5px;overflow-x:auto}
.nav-item{padding:12px 18px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.nav-item:hover{color:var(--primary)}
.nav-item.active{color:var(--primary);border-bottom-color:var(--primary)}
.container{max-width:1400px;margin:0 auto;padding:20px}
/* Dashboard */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:15px;padding:20px;border-left:5px solid var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-card.green{border-left-color:var(--success)}
.stat-card.red{border-left-color:var(--danger)}
.stat-card.blue{border-left-color:var(--info)}
.stat-card.orange{border-left-color:var(--warning)}
.stat-card.purple{border-left-color:#7c3aed}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;font-weight:600}
.stat-card .value{font-size:24px;font-weight:700;color:var(--text)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;margin-bottom:20px}
.chart-card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.chart-card h3{margin-bottom:15px;color:var(--primary-dark);font-size:16px}
.chart-container{position:relative;height:280px}
/* Tables */
.panel{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:20px}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.panel-header h3{color:var(--primary-dark);font-size:18px}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f3f4f6}
th{background:#fff7ed;color:var(--secondary);font-weight:600;font-size:13px;text-transform:uppercase}
tr:hover{background:#fff7ed}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.action-btns{display:flex;gap:5px}
.icon-btn{padding:5px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;background:#f3f4f6;color:var(--text)}
.icon-btn:hover{background:var(--primary);color:#fff}
.icon-btn.danger:hover{background:var(--danger)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:15px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:25px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{color:var(--primary-dark);font-size:20px}
.close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.radio-group{display:flex;gap:10px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:5px;padding:8px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px}
.radio-group input:checked+span{color:var(--primary)}
.radio-group label:has(input:checked){border-color:var(--primary);background:#fff7ed}
/* Receipt */
.receipt{background:#fff;border:2px dashed var(--primary);padding:25px;border-radius:10px;max-width:400px;margin:0 auto}
.receipt-header{text-align:center;margin-bottom:15px}
.receipt-header img{width:60px;height:60px;border-radius:50%;margin-bottom:8px}
.receipt-header h3{color:var(--primary-dark);font-size:16px}
.receipt-header p{font-size:12px;color:var(--muted)}
.receipt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted #ccc;font-size:13px}
.receipt-row .lbl{color:var(--muted)}
.receipt-row .val{font-weight:600}
.receipt-footer{text-align:center;margin-top:15px;color:var(--primary);font-weight:600;font-size:14px}
.receipt-actions{display:flex;gap:8px;justify-content:center;margin-top:15px;flex-wrap:wrap}
/* Settings */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.settings-card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.settings-card h3{color:var(--primary-dark);margin-bottom:15px;font-size:16px}
/* Public page */
.public-wrap{min-height:100vh;background:linear-gradient(135deg,#f97316,#ea580c);padding:20px}
.public-card{background:#fff;border-radius:20px;max-width:900px;margin:0 auto;padding:30px}
.public-card img{width:150px;height:150px;border-radius:50%;margin:0 auto 15px;display:block;border:5px solid var(--primary)}
.public-card h1{text-align:center;color:var(--primary-dark);margin-bottom:5px}
.public-card .morya{text-align:center;color:var(--primary);margin-bottom:20px;font-weight:600}
/* Loading */
.loader{display:inline-block;width:20px;height:20px;border:3px solid #f3f4f6;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:10px;color:#fff;font-weight:600;z-index:2000;animation:slideIn .3s}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.sync-status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}
.sync-status.online{background:#dcfce7;color:#166534}
.sync-status.offline{background:#fee2e2;color:#991b1b}
@media(max-width:768px){.form-row{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}.stats-grid{grid-template-columns:repeat(2,1fr)}.chart-container{height:220px}}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <img src="https://image.qwenlm.ai/public_source/4967fcf2-d1fd-41f1-bc25-f019b6086eea/1f52b0328-7efd-4337-841c-38474fb84a43.png" alt="Ganesha">
    <h1>Ganesh Festival</h1>
    <p class="subtitle">Fund Manager 2026</p>
    <p class="morya"> Ganpati Bappa Morya 🙏</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Login</button>
    <div class="login-creds">
      <strong>Default:</strong> admin / admin123<br>
      <strong>Viewer:</strong> viewer / viewer123
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="app">
  <div class="topbar">
    <div class="topbar-left">
      <img src="https://image.qwenlm.ai/public_source/4967fcf2-d1fd-41f1-bc25-f019b6086eea/1f52b0328-7efd-4337-841c-38474fb84a43.png" alt="Ganesha">
      <div>
        <h2 id="topTitle">Ganesh Festival 2026</h2>
        <p id="topSubtitle">Fund Manager</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="syncStatus" class="sync-status offline">⚫ Offline</span>
      <div class="year-tabs" id="yearTabs"></div>
      <span class="user-badge" id="userBadge">Admin</span>
      <button class="btn btn-secondary btn-sm" onclick="openPublicPage()">Public Page</button>
      <button class="btn btn-secondary btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="nav" id="mainNav">
    <div class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">Dashboard</div>
    <div class="nav-item" data-page="jama" onclick="showPage('jama')">Jama</div>
    <div class="nav-item" data-page="kharch" onclick="showPage('kharch')">Kharch</div>
    <div class="nav-item" data-page="members" onclick="showPage('members')">Members</div>
    <div class="nav-item" data-page="reports" onclick="showPage('reports')">Reports</div>
    <div class="nav-item" data-page="settings" onclick="showPage('settings')">Settings</div>
  </div>
  <div class="container" id="pageContent"></div>
</div>

<!-- PUBLIC PAGE -->
<div id="publicPage" class="public-wrap hidden">
  <div class="public-card">
    <img src="https://image.qwenlm.ai/public_source/4967fcf2-d1fd-41f1-bc25-f019b6086eea/1f52b0328-7efd-4337-841c-38474fb84a43.png" alt="Ganesha">
    <h1>Ganesh Festival 2026</h1>
    <p class="morya">🙏 Ganpati Bappa Morya 🙏</p>
    <p style="text-align:center;color:var(--muted);margin-bottom:20px">Public Transparency Report</p>
    <div class="stats-grid" id="publicStats"></div>
    <div class="charts-grid" id="publicCharts"></div>
    <div style="text-align:center;margin-top:20px">
      <button class="btn btn-secondary" onclick="closePublicPage()">Close</button>
    </div>
  </div>
</div>

<!-- MODAL CONTAINER -->
<div id="modalContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
import { getDatabase, ref, set, get, push, update, remove, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2XTiUUmy-tNxjulg51R630guVeWwu6ww",
  authDomain: "ganesh-festival-1207c.firebaseapp.com",
  databaseURL: "https://ganesh-festival-1207c-default-rtdb.firebaseio.com",
  projectId: "ganesh-festival-1207c",
  storageBucket: "ganesh-festival-1207c.firebasestorage.app",
  messagingSenderId: "924036874653",
  appId: "1:924036874653:web:6a30b2bf20f4e772e22f74",
  measurementId: "G-LN4797LZXW"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);

// ===== STATE =====
const state = {
  currentUser: null,
  currentYear: 2026,
  years: [2026, 2027, 2028],
  jama: [],
  kharch: [],
  members: [],
  settings: {
    festivalName: 'Ganesh Festival',
    committeeName: 'Ganesh Festival Committee',
    address: '',
    contactNumber: '',
    receiptFooter: '🙏 Ganpati Bappa Morya 🙏',
    approvalLimit: 5000,
    upiQrUrl: ''
  },
  admins: [
    { username: 'admin', password: 'admin123', role: 'admin', name: 'Administrator' },
    { username: 'viewer', password: 'viewer123', role: 'viewer', name: 'Viewer' }
  ],
  auditLog: [],
  trash: [],
  listeners: {}
};

// ===== FIREBASE HELPERS =====
function yearPath(node) { return `years/${state.currentYear}/${node}`; }

async function fbGet(path) {
  const snap = await get(ref(db, path));
  return snap.val();
}

async function fbSet(path, data) {
  await set(ref(db, path), data);
}

async function fbPush(path, data) {
  const newRef = push(ref(db, path));
  await set(newRef, { ...data, id: newRef.key, createdAt: Date.now() });
  return newRef.key;
}

async function fbUpdate(path, data) {
  await update(ref(db, path), data);
}

async function fbRemove(path) {
  await remove(ref(db, path));
}

function fbListen(path, callback) {
  const r = ref(db, path);
  onValue(r, (snap) => {
    const val = snap.val();
    callback(val || (Array.isArray(val) ? [] : {}));
  });
  return r;
}

function listenJama() {
  const r = fbListen(yearPath('jama'), (data) => {
    state.jama = data ? Object.values(data) : [];
    refreshCurrentPage();
  });
  state.listeners.jama = r;
}

function listenKharch() {
  const r = fbListen(yearPath('kharch'), (data) => {
    state.kharch = data ? Object.values(data) : [];
    refreshCurrentPage();
  });
  state.listeners.kharch = r;
}

function listenMembers() {
  const r = fbListen(yearPath('members'), (data) => {
    state.members = data ? Object.values(data) : [];
    refreshCurrentPage();
  });
  state.listeners.members = r;
}

function listenSettings() {
  fbListen(`settings/${state.currentYear}`, (data) => {
    if (data) state.settings = { ...state.settings, ...data };
    refreshCurrentPage();
  });
}

function listenAdmins() {
  fbListen('admins', (data) => {
    if (data) state.admins = Object.values(data);
  });
}

function listenAudit() {
  fbListen(yearPath('auditLog'), (data) => {
    state.auditLog = data ? Object.values(data) : [];
  });
}

function listenTrash() {
  fbListen(yearPath('trash'), (data) => {
    state.trash = data ? Object.values(data) : [];
  });
}

async function addAudit(action, details) {
  await fbPush(yearPath('auditLog'), {
    action, details,
    user: state.currentUser?.username || 'unknown',
    timestamp: Date.now()
  });
}

// ===== SYNC STATUS =====
function updateSyncStatus(online) {
  const el = document.getElementById('syncStatus');
  if (online) {
    el.className = 'sync-status online';
    el.textContent = '🟢 Synced';
  } else {
    el.className = 'sync-status offline';
    el.textContent = '⚫ Offline';
  }
}

// ===== AUTH =====
window.doLogin = async function() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) { toast('Please enter credentials', 'error'); return; }
  
  // Try Firebase first
  const adminsData = await fbGet('admins');
  let admins = adminsData ? Object.values(adminsData) : state.admins;
  if (!adminsData) {
    // Seed default admins
    for (const a of state.admins) {
      await fbPush('admins', a);
    }
  }
  
  const user = admins.find(a => a.username === u && a.password === p);
  if (!user) { toast('Invalid credentials', 'error'); return; }
  
  state.currentUser = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userBadge').textContent = `${user.role === 'admin' ? '👑' : ''} ${user.name}`;
  
  // Hide admin-only nav items for viewers
  const settingsNav = document.querySelector('[data-page="settings"]');
  if (settingsNav) settingsNav.style.display = user.role === 'admin' ? 'block' : 'none';
  
  await initApp();
  toast(`Welcome, ${user.name}!`, 'success');
};

window.doLogout = function() {
  state.currentUser = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
};

// ===== INIT =====
async function initApp() {
  updateSyncStatus(true);
  renderYearTabs();
  listenJama();
  listenKharch();
  listenMembers();
  listenSettings();
  listenAdmins();
  listenAudit();
  listenTrash();
  showPage('dashboard');
}

function renderYearTabs() {
  const c = document.getElementById('yearTabs');
  c.innerHTML = state.years.map(y => 
    `<div class="year-tab ${y === state.currentYear ? 'active' : ''}" onclick="switchYear(${y})">${y}</div>`
  ).join('');
}

window.switchYear = async function(y) {
  state.currentYear = y;
  document.getElementById('topTitle').textContent = `Ganesh Festival ${y}`;
  renderYearTabs();
  listenSettings();
  showPage('dashboard');
};

// ===== PAGES =====
let currentPage = 'dashboard';
let charts = {};

window.showPage = function(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  refreshCurrentPage();
};

function refreshCurrentPage() {
  if (currentPage === 'dashboard') renderDashboard();
  else if (currentPage === 'jama') renderJama();
  else if (currentPage === 'kharch') renderKharch();
  else if (currentPage === 'members') renderMembers();
  else if (currentPage === 'reports') renderReports();
  else if (currentPage === 'settings') renderSettings();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const totalJama = state.jama.reduce((s, j) => s + (parseFloat(j.amount) || 0), 0);
  const totalKharch = state.kharch.reduce((s, k) => s + (parseFloat(k.amount) || 0), 0);
  const today = new Date().toISOString().split('T')[0];
  const todayJama = state.jama.filter(j => j.date === today).reduce((s, j) => s + (parseFloat(j.amount) || 0), 0);
  const todayKharch = state.kharch.filter(k => k.date === today).reduce((s, k) => s + (parseFloat(k.amount) || 0), 0);
  const pendingMembers = state.members.filter(m => (m.expected || 0) - (m.paid || 0) > 0).length;
  const cashJama = state.jama.filter(j => j.mode === 'Cash').reduce((s, j) => s + (parseFloat(j.amount) || 0), 0);
  const upiJama = state.jama.filter(j => j.mode === 'UPI').reduce((s, j) => s + (parseFloat(j.amount) || 0), 0);
  const bankJama = state.jama.filter(j => j.mode === 'Bank Transfer').reduce((s, j) => s + (parseFloat(j.amount) || 0), 0);
  const cashKharch = state.kharch.filter(k => k.mode === 'Cash').reduce((s, k) => s + (parseFloat(k.amount) || 0), 0);
  const onlineKharch = state.kharch.filter(k => k.mode !== 'Cash').reduce((s, k) => s + (parseFloat(k.amount) || 0), 0);
  
  document.getElementById('pageContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card green"><div class="label">Total Jama</div><div class="value">${totalJama.toLocaleString('en-IN')}</div></div>
      <div class="stat-card red"><div class="label">Total Kharch</div><div class="value">₹${totalKharch.toLocaleString('en-IN')}</div></div>

function renderCharts() {
  Object.values(charts).forEach(c => c?.destroy());
  charts = {};
  
  const totalJama = state.jama.reduce((s, j) => s + (parseFloat(j.amount) || 0), 0);
  const totalKharch = state.kharch.reduce((s, k) => s + (parseFloat(k.amount) || 0), 0);
  
  const ctx1 = document.getElementById('chart1');
  if (ctx1) charts.c1 = new Chart(ctx1, {
    type: 'bar',
    data: { labels: ['Collection', 'Expense', 'Balance'], datasets: [{ data: [totalJama, totalKharch, totalJama-totalKharch], backgroundColor: ['#16a34a','#dc2626','#0284c7'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
  
  const catMap = {};
  state.kharch.forEach(k => { catMap[k.category||'Other'] = (catMap[k.category||'Other']||0) + (parseFloat(k.amount)||0); });
  const ctx2 = document.getElementById('chart2');
  if (ctx2) charts.c2 = new Chart(ctx2, {
    type: 'doughnut',
    data: { labels: Object.keys(catMap), datasets: [{ data: Object.values(catMap), backgroundColor: ['#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6','#ef4444'] }] },
    options: { responsive: true, maintainAspectRatio: false }
  });
  
  const dayMap = {};
  state.jama.forEach(j => { dayMap[j.date||'Unknown'] = (dayMap[j.date||'Unknown']||0) + (parseFloat(j.amount)||0); });
  const days = Object.keys(dayMap).sort().slice(-7);
  const ctx3 = document.getElementById('chart3');
  if (ctx3) charts.c3 = new Chart(ctx3, {
    type: 'line',
    data: { labels: days, datasets: [{ label: 'Collection', data: days.map(d => dayMap[d]), borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.2)', fill: true, tension: 0.4 }] },
    options: { responsive: true, maintainAspectRatio: false }
  });
  
  const modeMap = {};
  state.jama.forEach(j => { modeMap[j.mode||'Other'] = (modeMap[j.mode||'Other']||0) + (parseFloat(j.amount)||0); });
  const ctx4 = document.getElementById('chart4');
  if (ctx4) charts.c4 = new Chart(ctx4, {
    type: 'pie',
    data: { labels: Object.keys(modeMap), datasets: [{ data: Object.values(modeMap), backgroundColor: ['#16a34a','#3b82f6','#8b5cf6','#f59e0b'] }] },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

window.saveJama = async function() {
  const member = document.getElementById('jMember').value;
  const amount = parseFloat(document.getElementById('jAmount').value);
  const date = document.getElementById('jDate').value;
  const mode = document.querySelector('input[name="jMode"]:checked').value;
  const txnId = document.getElementById('jTxn').value;
  const by = document.getElementById('jBy').value;
  const notes = document.getElementById('jNotes').value;
  
  if (!member || !amount || !date) { toast('Please fill required fields', 'error'); return; }
  
  const id = await fbPush(yearPath('jama'), { member, amount, date, mode, txnId, collectedBy: by, notes });
  await addAudit('ADD_JAMA', `${member} - ₹${amount}`);
  
  // Update member paid amount
  const mem = state.members.find(m => m.name === member);
  if (mem) {
    await fbUpdate(yearPath(`members/${mem.id}`), { paid: (mem.paid||0) + amount });
  }
  
  closeModal();
  toast('Jama added successfully!', 'success');
  setTimeout(() => viewReceipt(id), 300);
};

window.deleteJama = async function(id) {
  if (!confirm('Delete this jama entry?')) return;
  const j = state.jama.find(x => x.id === id);
  await fbPush(yearPath('trash'), { ...j, originalTable: 'jama', deletedAt: Date.now() });
  await fbRemove(yearPath(`jama/${id}`));
  await addAudit('DELETE_JAMA', `ID: ${id}`);
  toast('Moved to trash', 'success');
};

window.editMember = function(id) { window.openMemberModal(id); };

window.saveMember = async function(editId) {
  const name = document.getElementById('mName').value.trim();
  const mobile = document.getElementById('mMobile').value.trim();
  const whatsapp = document.getElementById('mWhatsapp').value.trim();
  const area = document.getElementById('mArea').value.trim();
  const address = document.getElementById('mAddress').value.trim();
  const familyName = document.getElementById('mFamily').value.trim();
  const expected = parseFloat(document.getElementById('mExpected').value) || 0;
  
  if (!name || !mobile) { toast('Name and Mobile required', 'error'); return; }
  
  const data = { name, mobile, whatsapp, area, address, familyName, expected, paid: 0 };
  if (editId) {
    const existing = state.members.find(m => m.id === editId);
    data.paid = existing?.paid || 0;
    await fbUpdate(yearPath(`members/${editId}`), data);
    await addAudit('UPDATE_MEMBER', name);
  } else {
    await fbPush(yearPath('members'), data);
    await addAudit('ADD_MEMBER', name);
  }
  closeModal();
  toast('Member saved!', 'success');
};

window.deleteMember = async function(id) {
  if (!confirm('Delete this member?')) return;
  const m = state.members.find(x => x.id === id);
  await fbPush(yearPath('trash'), { ...m, originalTable: 'members', deletedAt: Date.now() });
  await fbRemove(yearPath(`members/${id}`));
  await addAudit('DELETE_MEMBER', m?.name);
  toast('Moved to trash', 'success');
};

window.filterMembersStatus = function(status) {
  document.querySelectorAll('#membersBody tr').forEach(tr => {
    if (status === 'all') tr.style.display = '';
    else tr.style.display = tr.dataset.status === status ? '' : 'none';
  });
};

window.filterMembersArea = function(area) {
  document.querySelectorAll('#membersBody tr').forEach(tr => {
    if (area === 'all') tr.style.display = '';
    else tr.style.display = tr.dataset.area === area ? '' : 'none';
  });
};

// ===== REPORTS =====
function renderReports() {
  document.getElementById('pageContent').innerHTML = `
    <div class="panel">
      <div class="panel-header"><h3>Reports</h3></div>
      <div class="form-row" style="margin-bottom:15px">
        <div class="form-group"><label>From Date</label><input type="date" id="rFrom"></div>
        <div class="form-group"><label>To Date</label><input type="date" id="rTo" value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group" style="display:flex;align-items:flex-end"><button class="btn btn-primary" onclick="generateReport()">Generate</button></div>
      </div>
      <div id="reportResults"></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Category Wise Expense</h3><div class="chart-container"><canvas id="rChart1"></canvas></div></div>
      <div class="chart-card"><h3>Budget vs Actual</h3><div class="chart-container"><canvas id="rChart2"></canvas></div></div>
    </div>
  `;
  renderReportCharts();
}

window.generateReport = function() {
  const from = document.getElementById('rFrom').value;
  const to = document.getElementById('rTo').value;
  const filteredJama = state.jama.filter(j => (!from || j.date >= from) && (!to || j.date <= to));
  const filteredKharch = state.kharch.filter(k => (!from || k.date >= from) && (!to || k.date <= to));
  const totalJ = filteredJama.reduce((s,j)=>s+(parseFloat(j.amount)||0),0);
  const totalK = filteredKharch.reduce((s,k)=>s+(parseFloat(k.amount)||0),0);
  
  document.getElementById('reportResults').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card green"><div class="label">Total Jama (Period)</div><div class="value">₹${totalJ.toLocaleString('en-IN')}</div></div>
      <div class="stat-card red"><div class="label">Total Kharch (Period)</div><div class="value">${totalK.toLocaleString('en-IN')}</div></div>
      <div class="stat-card blue"><div class="label">Balance (Period)</div><div class="value">₹${(totalJ-totalK).toLocaleString('en-IN')}</div></div>
    </div>
  `;
};

function renderReportCharts() {
  const catMap = {};
  state.kharch.forEach(k => { catMap[k.category||'Other'] = (catMap[k.category||'Other']||0) + (parseFloat(k.amount)||0); });
  const ctx1 = document.getElementById('rChart1');
  if (ctx1) new Chart(ctx1, {
    type: 'bar',
    data: { labels: Object.keys(catMap), datasets: [{ label: 'Amount', data: Object.values(catMap), backgroundColor: '#f97316' }] },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y' }
  });
  
  const ctx2 = document.getElementById('rChart2');
  if (ctx2) new Chart(ctx2, {
    type: 'bar',
    data: { 
      labels: Object.keys(catMap),
      datasets: [
        { label: 'Budget', data: Object.values(catMap).map(v => v * 1.2), backgroundColor: '#3b82f6' },
        { label: 'Actual', data: Object.values(catMap), backgroundColor: '#f97316' }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

        <div class="form-group"><label>Festival Name</label><input type="text" id="sFest" value="${state.settings.festivalName}"></div>

        <div class="form-group"><label>Address</label><textarea id="sAddr" rows="2">${state.settings.address}</textarea></div>
        <div class="form-group"><label>Contact Number</label><input type="text" id="sContact" value="${state.settings.contactNumber}"></div>
        <div class="form-group"><label>Receipt Footer</label><input type="text" id="sFooter" value="${state.settings.receiptFooter}"></div>

window.saveSettings = async function() {
  const data = {
    festivalName: document.getElementById('sFest').value,
    committeeName: document.getElementById('sComm').value,
    address: document.getElementById('sAddr').value,
    contactNumber: document.getElementById('sContact').value,
    receiptFooter: document.getElementById('sFooter').value,
    approvalLimit: parseFloat(document.getElementById('sLimit').value) || 5000,
    upiQrUrl: document.getElementById('sUpi').value
  };
  await fbSet(`settings/${state.currentYear}`, data);
  state.settings = { ...state.settings, ...data };
  await addAudit('UPDATE_SETTINGS', 'Festival settings updated');
  toast('Settings saved!', 'success');
};

window.openAdminModal = function() {
  openModal(`
    <div class="modal-header"><h3>Add Admin</h3><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Username</label><input type="text" id="aUser"></div>
    <div class="form-group"><label>Password</label><input type="password" id="aPass"></div>
    <div class="form-group"><label>Role</label>
      <select id="aRole"><option value="admin">Admin</option><option value="viewer">Viewer</option></select>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveAdmin()">Save</button>
  `);
};

window.saveAdmin = async function() {
  const username = document.getElementById('aUser').value.trim();
  const password = document.getElementById('aPass').value;
  const role = document.getElementById('aRole').value;
  if (!username || !password) { toast('Fill all fields', 'error'); return; }
  await fbPush('admins', { username, password, role, name: username });
  await addAudit('ADD_ADMIN', username);
  closeModal();
  toast('Admin added!', 'success');
};

window.deleteAdmin = async function(username) {
  if (!confirm('Delete this admin?')) return;
  const admin = state.admins.find(a => a.username === username);
  if (admin?.id) await fbRemove(`admins/${admin.id}`);
  toast('Admin deleted', 'success');
};

window.exportBackup = async function() {
  const data = {
    year: state.currentYear,
    exportedAt: new Date().toISOString(),
    jama: state.jama,
    kharch: state.kharch,
    members: state.members,
    settings: state.settings,
    auditLog: state.auditLog,
    trash: state.trash
  };
  downloadFile(JSON.stringify(data, null, 2), `backup_${state.currentYear}_${Date.now()}.json`, 'application/json');
  toast('Backup exported!', 'success');
};

window.importBackup = async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    if (data.jama) for (const j of data.jama) await fbPush(yearPath('jama'), j);
    if (data.kharch) for (const k of data.kharch) await fbPush(yearPath('kharch'), k);
    if (data.members) for (const m of data.members) await fbPush(yearPath('members'), m);
    if (data.settings) await fbSet(`settings/${state.currentYear}`, data.settings);
    toast('Backup imported!', 'success');
  } catch (err) { toast('Invalid backup file', 'error'); }
};

window.restoreTrash = async function(id) {
  const t = state.trash.find(x => x.id === id);
  if (!t) return;
  const table = t.originalTable;
  const { id: _, originalTable, deletedAt, ...rest } = t;
  await fbPush(yearPath(table), rest);
  await fbRemove(yearPath(`trash/${id}`));
  await addAudit('RESTORE', `${table} - ${t.name||t.category||t.member}`);
  toast('Restored!', 'success');
};

window.closePublicPage = function() { document.getElementById('publicPage').classList.add('hidden'); };

// ===== UTILS =====
function openModal(html) {
  document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
window.closeModal = function() { document.getElementById('modalContainer').innerHTML = ''; };

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// Enter key login
document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

// Online/offline detection
window.addEventListener('online', () => updateSyncStatus(true));
window.addEventListener('offline', () => updateSyncStatus(false));
</script>
